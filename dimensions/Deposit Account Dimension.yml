  label: Deposit Account Hierarchy
  description: Account Type > Deposit Account.
  folder: Deposit Account Attributes
  levels:
  - unique_name: Deposit Account Type
  - unique_name: Deposit Account
    secondary_attributes:
    - unique_name: Deposit Account Status
      label: Deposit Account Status
      description: "Active, Dormant, Blocked or Closed."
