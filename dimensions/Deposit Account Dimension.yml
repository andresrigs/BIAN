      description: "Term deposit maturity date."
      folder: Deposit Account Attributes
      dataset: DIM_DEPOSIT_ACCOUNT
      name_column: MATURITY_DATE
      key_columns:
      - MATURITY_DATE
level_attributes:
- unique_name: Deposit Account Type
  label: Deposit Account Type
