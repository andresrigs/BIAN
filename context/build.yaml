# Build parameters supplied in the chat request (written here for reproducibility)
model_unique_name: bian_model            # composite; label "BIAN Model"
composite: true
component_models: [bian_cards, bian_deposits]
catalog_unique_name: bian_model_catalog
warehouse: Snowflake
connection: {database: BIAN_DEMO, schema: BIAN}
