unique_name: Card Transaction Amount Prior Year
object_type: metric_calc
label: Card Transaction Amount Prior Year
description: "Card Transaction Amount for the same period one year earlier, by Transaction Date."
expression: "CASE WHEN ISEMPTY([Measures].[Card Transaction Amount]) THEN NULL ELSE (ParallelPeriod([Transaction Date Dimension].[Transaction Date Hierarchy].[Transaction Year], 1, [Transaction Date Dimension].[Transaction Date Hierarchy].CurrentMember), [Measures].[Card Transaction Amount]) END"
format: "$#,##0.00"
