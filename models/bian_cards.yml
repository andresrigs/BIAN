unique_name: bian_cards
object_type: model
label: BIAN Cards
description: "BIAN Cards business domain: Credit Card, Credit Card Position Keeping, Card Authorization, Card Case, Card Collections, Issued Device Administration, Merchant Relations and Reward Points Account service domains."
visible: true
